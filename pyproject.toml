[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "euler-train"
version = "2.10.0"
description = "Lightweight file-based experiment logger for PyTorch"
requires-python = ">=3.9"
dependencies = ["numpy", "euler-dataset-contract"]

[project.optional-dependencies]
images = ["Pillow"]
gpu = ["nvidia-ml-py"]
architecture = ["onnx", "onnxruntime", "onnxsim"]
naming = ["euler-metric-naming"]
dev = ["pytest", "Pillow", "torch", "nvidia-ml-py", "onnx", "onnxruntime", "onnxsim"]

[project.scripts]
"euler-train.stream.check" = "euler_train.stream_check_cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
