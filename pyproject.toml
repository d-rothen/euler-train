[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "euler-train"
version = "0.1.1"
description = "Lightweight file-based experiment logger for PyTorch"
requires-python = ">=3.9"
dependencies = ["numpy"]

[project.optional-dependencies]
images = ["Pillow"]
dev = ["pytest", "Pillow", "torch"]
